# =============================================================================
# Deploy oasis-knowledge to AWS S3 + CloudFront
# =============================================================================
# dev branch  -> dev-knowledge-451873237418  -> knowledge.dev.o-x.io (password-gated preview)
# prod branch -> prod-knowledge-075202835966 -> knowledge.o-x.io   (public)
#
# Two jobs on purpose (2026-09-16):
#   build  — runs repository code (`npm ci` runs package lifecycle scripts,
#            `vite build` runs vite.config.js). It holds NO cloud credential and
#            cannot request one (no id-token permission).
#   deploy — holds a short-lived AWS role and runs NO repository code. It only
#            downloads the built files and uploads them.
# So a change to package.json, a dependency, or vite.config.js cannot reach AWS.
# Only a change to THIS file could, and pushing a workflow change needs the
# GitHub `workflows` permission, which bot tokens for this repo do not carry.
#
# AWS access is GitHub OIDC, not stored keys. The roles trust exactly one ref:
#   repo:MikeHLee/oasis-knowledge:ref:refs/heads/dev   (dev account)
#   repo:MikeHLee/oasis-knowledge:ref:refs/heads/prod  (prod account)
# and can only write the knowledge bucket + invalidate its distribution.
# Terraform: oasis-cloud-admin environments/{dev,prod}/iam-github-oidc-knowledge.tf
# =============================================================================

name: Deploy Knowledge Site

on:
  push:
    branches:
      - dev
      - prod
  # Redeploys the branch it is run from. There is deliberately no environment
  # input: the AWS role is chosen by the ref, so a dev-ref run cannot publish
  # to prod (the prod role would refuse its token anyway).
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-knowledge-${{ github.ref_name }}
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    if: github.ref_name == 'dev' || github.ref_name == 'prod'
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Check build output
        run: |
          test -f dist/index.html || { echo "::error::dist/index.html missing"; exit 1; }

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist/
          retention-days: 1
          if-no-files-found: error

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Select environment
        id: config
        run: |
          if [ "${{ github.ref_name }}" = "prod" ]; then
            echo "environment=prod" >> "$GITHUB_OUTPUT"
            echo "role=arn:aws:iam::075202835966:role/oidc/github-actions-knowledge-prod" >> "$GITHUB_OUTPUT"
            echo "s3_bucket=prod-knowledge-075202835966" >> "$GITHUB_OUTPUT"
            echo "cf_distribution=E2CBGMZCQ0BFYF" >> "$GITHUB_OUTPUT"
            echo "url=https://knowledge.o-x.io" >> "$GITHUB_OUTPUT"
          else
            echo "environment=dev" >> "$GITHUB_OUTPUT"
            echo "role=arn:aws:iam::451873237418:role/oidc/github-actions-knowledge-dev" >> "$GITHUB_OUTPUT"
            echo "s3_bucket=dev-knowledge-451873237418" >> "$GITHUB_OUTPUT"
            echo "cf_distribution=EF53AALTYQW6L" >> "$GITHUB_OUTPUT"
            echo "url=https://knowledge.dev.o-x.io" >> "$GITHUB_OUTPUT"
          fi

      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: site
          path: dist

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ steps.config.outputs.role }}
          role-session-name: knowledge-${{ steps.config.outputs.environment }}-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      # papers/ holds PDFs uploaded outside this repo (ORG-116). They are not in
      # dist/, so --delete would remove them without the exclude.
      - name: Sync assets to S3 (long cache)
        run: |
          aws s3 sync dist/ "s3://${{ steps.config.outputs.s3_bucket }}/" \
            --delete \
            --exclude "*.html" \
            --exclude "papers/*" \
            --cache-control "max-age=31536000,public,immutable"

      # Filter order matters: aws s3 sync applies filters in order and the LAST
      # match wins. The previous `--include "*.html" --exclude "*"` excluded
      # everything, so index.html was never uploaded to the dev bucket.
      - name: Sync HTML to S3 (short cache)
        run: |
          aws s3 sync dist/ "s3://${{ steps.config.outputs.s3_bucket }}/" \
            --delete \
            --exclude "*" \
            --include "*.html" \
            --exclude "papers/*" \
            --cache-control "max-age=300,public"

      - name: Check index.html is live in the bucket
        run: |
          aws s3api head-object --bucket "${{ steps.config.outputs.s3_bucket }}" --key index.html >/dev/null

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ steps.config.outputs.cf_distribution }}" \
            --paths "/*"

      - name: Summary
        run: |
          {
            echo "## Knowledge Site Deployed"
            echo "**Environment:** ${{ steps.config.outputs.environment }}"
            echo "**URL:** ${{ steps.config.outputs.url }}"
            echo "**Commit:** ${{ github.sha }}"
          } >> "$GITHUB_STEP_SUMMARY"
